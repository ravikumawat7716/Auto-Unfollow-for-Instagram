<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --blue: #007aff; --red: #ff3b30; --fill: rgba(118,118,128,.12); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --blue: #0a84ff; --red: #ff453a; --fill: rgba(118,118,128,.24); } }
  * { box-sizing: border-box; }
  body { width: 280px; margin: 0; padding: 18px 16px 16px; font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--label); background: var(--bg); }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .head img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: -.2px; margin: 0; }
  p { margin: 2px 0 0; color: var(--label2); font-size: 12px; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  button { display: flex; align-items: center; gap: 10px; width: 100%; font: inherit; font-size: 13.5px; text-align: left; padding: 11px 14px; border: none; background: none; color: var(--blue); cursor: pointer; }
  button + button { border-top: .5px solid rgba(128,128,128,.3); }
  button:hover { background: var(--fill); }
  button:active { opacity: .6; }
  button svg { flex: none; }
  #msg { color: var(--red); font-size: 12px; margin-top: 10px; }
  #msg:empty { display: none; }
</style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Auto Unfollow for Instagram</h1>
      <p>The panel lives on instagram.com, bottom right.</p>
    </div>
  </div>
  <div class="group">
    <button id="toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M13 14h5"/></svg>Show or hide panel</button>
    <button id="open"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open Instagram</button>
  </div>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
