<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1c1e21; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #e8eaed; background: #1f2124; } p { color: #a0a4a8 !important; } }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #65676b; }
  button { width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #0866ff; background: #0866ff; color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
  button.alt { background: transparent; color: #0866ff; }
  #msg { color: #d93025; font-size: 12px; min-height: 1em; }
</style>
</head>
<body>
  <h1>Auto Unfollow for Instagram</h1>
  <p>The panel lives on instagram.com, in the bottom right corner.</p>
  <button id="toggle">Show / hide panel</button>
  <button id="open" class="alt">Open Instagram</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
